name: Build and push

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          tag=$(curl -sf \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/marcselis/Easywave2MQTT/releases/latest \
            | jq -r '.tag_name')
          echo "tag=$tag" >> $GITHUB_OUTPUT

      - name: Get current built version
        id: current
        run: echo "tag=$(cat VERSION 2>/dev/null || echo '')" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        if: steps.upstream.outputs.tag != steps.current.outputs.tag
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PAT }}

      - name: Set up Docker Buildx
        if: steps.upstream.outputs.tag != steps.current.outputs.tag
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: steps.upstream.outputs.tag != steps.current.outputs.tag
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          push: true
          build-args: BUILD_VERSION=${{ steps.upstream.outputs.tag }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/easywave2mqtt:${{ steps.upstream.outputs.tag }}
            ${{ secrets.DOCKER_USERNAME }}/easywave2mqtt:latest

      - name: Commit updated VERSION
        if: steps.upstream.outputs.tag != steps.current.outputs.tag
        run: |
          echo "${{ steps.upstream.outputs.tag }}" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump to ${{ steps.upstream.outputs.tag }}"
          git push
